name: TEE checks
on:
  pull_request:
    paths:
      - 'packages/shared/**'
      - 'services/enclave/**'
      - 'services/rpc-gateway/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'test/**'
      - 'infra/nitro/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest*.config.*'
      - '.github/workflows/tee-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.9.0
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contracts
      - run: pnpm test:escape
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:hpke:browser
      - run: python -m pip install -r scripts/attestation-requirements.txt
      - run: python -m unittest discover -s test -p '*_test.py' -v
      - run: pnpm audit --prod
      - run: bash -n infra/nitro/*.sh && python -m py_compile services/enclave/nitro/*.py
